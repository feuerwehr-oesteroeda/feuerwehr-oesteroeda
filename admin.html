<!DOCTYPE html>
<html>
<head>
  <title>Admin Bereich</title>
</head>
<body>

<h2>Einsatz hinzufügen</h2>

<input type="text" id="titel" placeholder="Titel">
<input type="text" id="datum" placeholder="Datum">
<textarea id="bericht" placeholder="Bericht"></textarea>
<input type="text" id="bild" placeholder="images/bild.jpg">

<button onclick="speichern()">Speichern</button>

<script type="module">
import { auth, db } from "./firebase.js";
import { addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});

window.speichern = async function() {
  const titel = document.getElementById("titel").value;
  const datum = document.getElementById("datum").value;
  const bericht = document.getElementById("bericht").value;
  const bild = document.getElementById("bild").value;

  await addDoc(collection(db, "einsaetze"), {
    titel,
    datum,
    bericht,
    bild
  });

  alert("Einsatz gespeichert!");
}
</script>

</body>
</html>
